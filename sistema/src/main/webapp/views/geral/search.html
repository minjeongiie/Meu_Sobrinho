<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Buscar profissionais — Meu Sobrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body class="bg-light">
<!-- Navbar (simplificada) -->
<nav class="navbar navbar-expand-lg navbar-white bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand header-brand" href="index.html"><div class="brand-badge">MS</div><div><div class="fw-bold">Meu Sobrinho</div></div></a>
        <form class="d-flex ms-3" action="search.html" method="get">
            <input name="q" class="form-control me-2" placeholder="Buscar..." value="">
            <button class="btn btn-outline-secondary" type="submit">Buscar</button>
        </form>
        <div class="ms-auto">
            <a class="btn btn-outline-primary" href="login.html">Entrar</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="row">
        <aside class="col-lg-3 mb-3">
            <div class="card card-shadow p-3">
                <h6>Filtros</h6>
                <form id="filterForm">
                    <div class="mb-2"><label class="form-label small">Categoria</label>
                        <select name="category" class="form-select"><option value="">Todas</option><option>Eletricista</option><option>Encanador</option></select>
                    </div>
                    <div class="mb-2"><label class="form-label small">Cidade</label><input name="city" class="form-control" placeholder="Ex: Seropédica"></div>
                    <button class="btn btn-sm btn-primary w-100" type="submit">Aplicar</button>
                </form>
            </div>
        </aside>

        <section class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Resultados</h5>
                <small class="text-muted">Ordenar por:
                    <select id="sort" class="form-select form-select-sm d-inline-block w-auto ms-2">
                        <option value="relevance">Relevância</option>
                        <option value="rating">Avaliação</option>
                    </select>
                </small>
            </div>

            <div id="resultsList" class="row g-3">
                <!-- preenchido por app.js -->
            </div>

            <nav class="mt-3" aria-label="Paginação">
                <ul class="pagination">
                    <li class="page-item disabled"><a class="page-link">Anterior</a></li>
                    <li class="page-item active"><a class="page-link">1</a></li>
                    <li class="page-item"><a class="page-link">2</a></li>
                    <li class="page-item"><a class="page-link">Próxima</a></li>
                </ul>
            </nav>
        </section>
    </div>
</main>

<footer class="bg-white footer-small">
    <div class="container text-center text-muted">© <span id="year"></span> Meu Sobrinho</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
