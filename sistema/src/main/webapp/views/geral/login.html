<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Entrar — Meu Sobrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center" style="min-height:75vh">
    <div class="card card-shadow" style="max-width:480px;width:100%">
        <div class="card-body">
            <h4 class="card-title mb-3">Entrar</h4>
            <form id="loginForm" data-type="client" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input name="email" type="email" class="form-control" required>
                    <div class="invalid-feedback">Informe um email válido.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Senha</label>
                    <input name="password" type="password" class="form-control" required>
                    <div class="invalid-feedback">Informe sua senha.</div>
                </div>

                <div class="d-flex gap-2 mb-3">
                    <button class="btn btn-primary w-100" type="submit">Entrar</button>
                    <a href="register.html" class="btn btn-outline-secondary">Criar conta</a>
                </div>

                <div class="d-flex justify-content-between small-muted">
                    <a href="recover.html">Esqueci minha senha</a>
                    <a href="register-provider.html">Sou prestador</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
