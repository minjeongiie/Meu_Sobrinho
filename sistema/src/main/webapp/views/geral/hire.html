<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contratar — Meu Sobrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-white bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="index.html">Meu Sobrinho</a>
    </div>
</nav>

<main class="container py-4">
    <div class="card card-shadow">
        <div class="card-body">
            <h5 id="hireTitle">Contratar</h5>
            <form id="hireForm" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label class="form-label">Descrição do serviço</label>
                    <textarea name="service" class="form-control" rows="3" required></textarea>
                    <div class="invalid-feedback">Descreva o serviço.</div>
                </div>
                <div class="mb-3 row">
                    <div class="col-md-6">
                        <label class="form-label">Data desejada</label>
                        <input name="date" type="date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Preço acordado (R$)</label>
                        <input name="price" type="number" class="form-control" required>
                    </div>
                </div>
                <button class="btn btn-primary" type="submit">Confirmar contratação</button>
            </form>
        </div>
    </div>
</main>

<footer class="bg-white footer-small">
    <div class="container text-center text-muted">© <span id="year"></span> Meu Sobrinho</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
