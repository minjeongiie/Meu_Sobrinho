<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Recuperar senha — Meu Sobrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center" style="min-height:70vh">
    <div class="card card-shadow" style="max-width:520px;width:100%">
        <div class="card-body">
            <h5>Recuperar senha</h5>

            <!-- Formulário único: email + pergunta sempre visível -->
            <form id="recoverFullForm" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input id="recoverEmail" type="email" class="form-control" placeholder="seu@email.com" required>
                    <div class="invalid-feedback">Informe um email válido.</div>
                </div>

                <!-- Pergunta: sempre visível. Se o email existir, mostramos a pergunta salva; caso contrário, o usuário escolhe -->
                <div class="mb-3">
                    <label class="form-label">Pergunta de segurança</label>

                    <!-- Texto da pergunta vinda do cadastro (se existir) -->
                    <div id="recoverQuestionText" class="small-muted mb-2" style="min-height:1.6em"></div>

                    <!-- Fallback: select para escolher pergunta caso o email não exista ou usuário prefira -->
                    <select id="recoverQuestionSelect" name="securityQuestion" class="form-select d-none">
                        <option value="">Selecione uma pergunta</option>
                        <option value="nome_mae">Qual o nome da sua mãe?</option>
                        <option value="cidade_natal">Qual sua cidade natal?</option>
                        <option value="primeiro_pet">Qual o nome do seu primeiro pet?</option>
                        <option value="outro">Outra pergunta (escreva abaixo)</option>
                    </select>

                    <div class="mt-2 d-none" id="recoverCustomQuestionWrap">
                        <input id="recoverCustomQuestion" name="securityQuestionCustom" class="form-control" placeholder="Escreva sua pergunta">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Resposta</label>
                    <input id="recoverAnswer" type="text" class="form-control" required>
                    <div class="invalid-feedback">Informe a resposta.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nova senha</label>
                    <input id="recoverNewPassword" type="password" class="form-control" required>
                    <div class="invalid-feedback">Informe a nova senha.</div>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Redefinir senha</button>
                    <a class="btn btn-outline-secondary" href="login.html">Voltar ao login</a>
                </div>
            </form>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
